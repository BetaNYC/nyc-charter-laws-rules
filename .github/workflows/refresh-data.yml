# Daily corpus-data refresh (issue #2).
#
# Runs the full index-refresh pipeline against AML's public bulk XML, runs the
# test suite, and commits the refreshed index back to `main` ONLY when the build
# actually produced a change. The build is now genuinely idempotent: a no-op
# rebuild yields a byte-identical tree — including the README "Last index update"
# badge, whose run-outcome churn was fixed at the source in update-changelog.js
# (the no-op run leaves the badge block untouched; see test/build-idempotence.test.js
# "README badge does not churn ..."). PR #10 made the index content idempotent but
# left that badge churn, which an earlier version of this workflow masked with a
# grep-based guard. That workaround is gone: the commit guard is a plain
# `git diff --quiet` over the allow-listed paths.
#
# File naming: refresh-data.yml — the name test.yml and differential.yml already
# anticipate. Distinct from test.yml (unit tests, per-PR) and differential.yml
# (nightly cross-engine parser check).
#
# Automatic npm releases (issue #26, option 2): when a refresh commits changed
# data, the same commit bumps the PATCH version (package.json + lock) and adds a
# dated RELEASES.md entry (scripts/auto-release.js prepare). The "Release if
# needed" step then pushes the vX.Y.Z tag and dispatches release.yml, the ONLY
# workflow that publishes to npm. No data change, no release.
#
# WHATS-CHANGED.md: automatic releases never add an entry (daily law text is
# recorded in CHANGELOG.md). prepare does not bump while WHATS-CHANGED.md has an
# "## Unreleased:" entry: normally that entry sits beside an unpublished hand
# bump, which already stops the bump; beside a published version, prepare fails
# under --soft, so the data is committed and the run goes red below. Either way
# release.yml's What's changed gate never stops, and never ships, an automatic
# release.
#
# A hand release waiting for its tag pauses automatic releases. After it has been
# on main for more than two days (New York dates), prepare fails under --soft: the
# law text is still committed and the run goes red, naming the release to finish.
#
# Why dispatch rather than rely on the tag push: "When you use the repository's
# GITHUB_TOKEN to perform tasks, events triggered by the GITHUB_TOKEN, with the
# exception of workflow_dispatch and repository_dispatch, will not create a new
# workflow run." (https://docs.github.com/en/actions/using-workflows/triggering-a-workflow
# "Triggering a workflow from a workflow"). The tag we push with GITHUB_TOKEN
# therefore does NOT start release.yml's `push: tags` trigger; `gh workflow run
# release.yml --ref vX.Y.Z` (REST "Create a workflow dispatch event": `ref` "can
# be a branch or tag name"; token needs Actions: write,
# https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event)
# does. The dispatched run is a run OF release.yml, which is the workflow
# filename npm trusted publishing is bound to (see release.yml).
#
# Coverage audit (issue #78), report only: after build-index, `npm run audit:coverage` writes
# how much of each document's text reached the index, and any text it did not, to the run's
# step summary. It has continue-on-error, writes no file in the repo, and no later step reads
# its outcome, so it can never block the tests, the commit, the release or the deploy. A person
# reads the summary; `npm run audit:coverage -- --check` is the gate to use by hand.
#
# The website (issue #64): when the commit step pushed something the site is built from (new
# law text, or the site structure alone), the last step dispatches deploy-site.yml on main,
# for the same GITHUB_TOKEN reason. No commit, or a commit of the download record alone
# (data/fetch-provenance.json), no deploy.
#
# Idempotent on rerun: the checkout is `ref: main` (not the original run's SHA),
# so a rerun after the bump commit landed rebuilds to no diff and only the
# "Release if needed" step acts. That step re-checks npm, the remote tag and
# existing release.yml runs, so it never re-tags, never double-dispatches, and
# goes red (naming the run to rerun) if the release for the current automatic
# version failed. See RELEASES.md "Automatic releases" for recovery.
#
# Auth: the built-in GITHUB_TOKEN is sufficient. `permissions: contents: write`
# lets the default checkout token push to `main` — NO PAT, NO repository secret,
# NO deploy key. The AML fetch is public HTTPS with no credential.
#
# Checked downloads (issue #55): fetch-data refuses http and any redirect off https or off
# files.amlegal.com, and checks each ZIP (status, Content-Type, Content-Length, a readable ZIP
# in American Legal's XML layout, and no smaller than half the last good download) before it
# replaces data/raw/. It records each ZIP's URL, bytes, sha256, Last-Modified and ETag in
# data/fetch-provenance.json, which the commit step stages with the index it was built from.
# The floor (half) and the ceiling (four times) follow that record. When American Legal
# really does change a file's size, run this workflow by hand with `allow_size_change` naming
# the document(s); the waiver lasts that run only, and the committed record makes the new
# file the baseline.

name: Refresh Data

on:
  schedule:
    # 11:00 UTC = 07:00 EDT / 06:00 EST. GitHub Actions cron is UTC ONLY and does
    # NOT observe DST, so the local run time shifts an hour across the year; it can
    # also lag several minutes under load. Immaterial — AML publishes irregularly
    # and the requirement is just "once each morning."
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (optional)"
        required: false
        default: ""
      allow_size_change:
        description: "Only after checking American Legal's file: accept a ZIP under half or over four times the last good size, for these documents (comma-separated: charter, admin_code, rules). Empty on every other run."
        required: false
        default: ""

# contents: write — push the refreshed index, the version bump and the tag to
#   main with the built-in token (main has no branch protection; this job has
#   always pushed there directly).
# actions: write — dispatch release.yml (REST "Create a workflow dispatch event").
permissions:
  contents: write
  actions: write

# Never let two refreshes overlap (a slow fetch-data must not race a second
# trigger). cancel-in-progress: false so an in-flight refresh is never killed
# mid-commit — the next run queues behind it instead.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh charter index from AML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # The committed index is the diff baseline for the commit guard.
        uses: actions/checkout@v4
        with:
          # Latest main, not the triggering SHA: a rerun of a failed run must see
          # a bump commit an earlier attempt already pushed (no double bump).
          ref: main
          # Full commit history, but file contents only on demand ("Partially clone
          # against a given filter", actions/checkout v4 action.yml), so the index
          # history is not downloaded. auto-release.js prepare walks main's commits to
          # find when a waiting hand release reached main, and turns the run red once
          # it has waited more than two days (the daily npm release is paused meanwhile).
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22.x — upper end of the test.yml matrix; satisfies engines.node ">=20 <23".
          # This is the operational build, not the cross-version test matrix.
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch data from AML
        # Pulls AML bulk XML ZIPs over https (public, no auth) and checks each one
        # (scripts/lib/fetch-zip.js). A failed download or check fails the job red
        # BEFORE build-index, so no partial, half-refreshed or swapped index can land.
        env:
          # Empty on the schedule; on a manual run, the allow_size_change input, for this run
          # only. Passed through env, never pasted into the script, so the input cannot inject
          # shell.
          NYC_CLR_ALLOW_SIZE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_size_change || '' }}
        run: npm run fetch-data

      - name: Build index
        # Rebuilds data/index/json + data/index/markdown + versions.json, the site structure, and
        # data/index-build.json (which build code made the index; release.yml checks it).
        run: npm run build-index

      - name: Coverage audit (report only)
        # Issue #78. Never blocks anything: continue-on-error, no `id` (no step reads its
        # outcome), output only to $GITHUB_STEP_SUMMARY, no file written in the repo. Without
        # --check it exits 0 even when text is unread; a crash shows in the summary instead.
        # `head -c` keeps the summary under GitHub's 1 MiB step limit.
        continue-on-error: true
        run: |
          {
            echo "## Index coverage audit (report only)"
            echo
            echo '```text'
            npm run --silent audit:coverage 2>&1 | head -c 200000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update changelog
        # Updates data/changelog.json, CHANGELOG.md, and re-stamps README.md.
        run: npm run update-changelog

      - name: Run tests
        # Full suite (node --test, via pretest build). MUST pass before any commit —
        # a broken build never reaches main. A failure fails the job and skips
        # the commit step below.
        run: npm test

      - name: Commit refreshed index if changed
        id: commit
        # Guard: commit + push iff the pipeline produced a REAL change.
        #
        # The build is now genuinely idempotent — a no-op rebuild leaves every
        # allow-listed path byte-identical, INCLUDING the README "Last index update"
        # badge. That residual badge churn (which PR #10's index-idempotence fix
        # left behind, and which an earlier version of this step masked with a
        # grep-based diff filter) is now fixed at the source in update-changelog.js:
        # a no-op run leaves the badge block untouched. So the guard is a plain
        # `git diff --quiet` over the allow-list — if nothing changed, exit clean
        # with no commit; otherwise stage the allow-list and commit. Real version
        # bumps move versions.json / the index / the table rows, so they always
        # register.
        #
        # Runs only after tests passed, so any commit is always test-gated.
        run: |
          set -euo pipefail

          # Allow-list of legitimate refresh artifacts. Never `git add -A`.
          # package.json, package-lock.json, server.json and RELEASES.md are added below ONLY
          # when auto-release.js bumps the version (its own targeted edits); an
          # incidental `npm ci` lock churn is never staged on a no-release day.
          PATHS=(
            data/index/json
            data/index/markdown
            data/changelog.json
            CHANGELOG.md
            README.md
          )
          # Committed beside the index but not in the npm package (package.json `files` has
          # data/index/json only), so a change to them alone needs no release:
          #   data/structure/             the site structure (issue #61), built by build-index
          #   data/fetch-provenance.json  which ZIP bytes were downloaded (issue #55), by fetch-data
          #   data/index-build.json       which build code made the index (issue #95), by
          #                               build-index; release.yml checks it. It changes alone
          #                               when the build code changed but the index did not.
          # `git status --porcelain` rather than `git diff`: the first build creates these
          # files, and git diff does not see untracked files.
          UNSHIPPED_PATHS=(data/structure data/fetch-provenance.json data/index-build.json)
          unshipped_changed() { [ -n "$(git status --porcelain -- "${UNSHIPPED_PATHS[@]}")" ]; }

          # The build is idempotent, so a no-op rebuild leaves the allow-list
          # byte-identical. Commit iff anything in it actually changed.
          if git diff --quiet -- "${PATHS[@]}"; then
            if unshipped_changed; then
              # The website reads the structure, not the download record: redeploy only if
              # the structure moved. Checked before `git add`, which would hide it, and kept in
              # a variable: the output is written only after the push succeeds.
              structure_changed=""
              if [ -n "$(git status --porcelain -- data/structure)" ]; then
                structure_changed=true
              fi
              # Only the site structure, the download record or the build record changed: a
              # first build, a change to the build code that left the index as it was, or
              # American Legal re-zipping text that did not change. Commit it with no version
              # bump and no release.
              git add -- "${UNSHIPPED_PATHS[@]}"
              git \
                -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: refresh site structure and download record $(TZ=America/New_York date +%F)"
              git push origin HEAD:main
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              if [ -n "$structure_changed" ]; then
                echo "deploy=true" >> "$GITHUB_OUTPUT"
              fi
              echo "refresh-data: pushed the site structure and download record to main (no index change, no release)"
              exit 0
            fi
            echo "refresh-data: no change after rebuild — skipping commit"
            exit 0
          fi

          echo "refresh-data: real change detected — committing refreshed index"

          # Derive a human-readable delta from the newest changelog.json entry's
          # per-corpus previousThrough → currentThrough moves. Fail-soft on the
          # MESSAGE only (never on the guard): fall back to a generic note.
          DELTA="$(node -e '
            try {
              const fs = require("fs");
              const log = JSON.parse(fs.readFileSync("data/changelog.json", "utf8"));
              const entry = Array.isArray(log) ? log[0] : (log.entries || [])[0];
              const corpora = (entry && (entry.corpora || entry.corpuses)) || {};
              // Shorten "Current through Local Law 2026/110, ..." -> "LL 2026/110";
              // "... rules effective June 17, 2026." -> "eff. June 17, 2026" (the
              // corpus name is prefixed separately, so the tag omits it);
              // otherwise fall back to the raw string.
              const tag = (s) => {
                if (!s) return s;
                const ll = s.match(/Local Law\s+(\d+\/\d+)/i);
                if (ll) return "LL " + ll[1];
                const r = s.match(/rules effective\s+(.+?)\.?$/i);
                if (r) return "eff. " + r[1];
                return s.trim();
              };
              const parts = [];
              for (const [name, c] of Object.entries(corpora)) {
                const prev = c.previousThrough, cur = c.currentThrough;
                if (cur && prev && prev !== cur) parts.push(name + " " + tag(prev) + " -> " + tag(cur));
                else if (cur && !prev) parts.push(name + " " + tag(cur));
              }
              process.stdout.write(parts.length ? parts.join("; ") : "index version bump");
            } catch (e) {
              process.stdout.write("index version bump");
            }
          ')"
          [ -n "$DELTA" ] || DELTA="index version bump"

          # Automatic patch release: bump package.json + lock and add the dated
          # RELEASES.md entry (New York date), in this same commit. Prints the
          # new version, or nothing (with a warning) when the current version is
          # not on npm yet — a pending manual release or an unfinished automatic
          # one, which we must not skip past.
          #
          # The law data is committed even if the release cannot be prepared
          # (registry unreachable, next version already tagged or published,
          # lockfile mismatch): --soft leaves the version files untouched, warns,
          # and sets the step output prepare_failed=true, which turns the run red
          # in the last step AFTER the data has landed. The `||` branch is a
          # backstop for an unexpected crash of the script itself.
          RELEASE_VERSION="$(node scripts/auto-release.js prepare --soft)" || {
            echo "::warning::auto-release prepare crashed; committing data without a version bump"
            git checkout -- package.json package-lock.json server.json RELEASES.md
            echo "prepare_failed=true" >> "$GITHUB_OUTPUT"
            RELEASE_VERSION=""
          }
          SUFFIX=""
          if [ -n "$RELEASE_VERSION" ]; then
            PATHS+=(package.json package-lock.json server.json RELEASES.md)
            # Must match releaseMarker() in scripts/auto-release.js: ensure finds
            # the bump commit by it when it has to tag on a later run.
            SUFFIX=" (release v${RELEASE_VERSION})"
          fi

          # Stage only the allow-listed paths, and the site structure and download record
          # that go with them.
          PATHS+=("${UNSHIPPED_PATHS[@]}")
          git add -- "${PATHS[@]}"

          # Commit as github-actions[bot] with identity set inline (no global config).
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: refresh index $(TZ=America/New_York date +%F) — ${DELTA}${SUFFIX}"

          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "refresh-data: pushed refreshed index to main"

      - name: Release if needed
        # Runs every day, after the commit step (and only if it succeeded). For
        # package.json's version: if its RELEASES.md entry is an automatic one
        # and it is not on npm yet, create the vX.Y.Z tag on the bump commit via the GitHub API (if missing) and
        # dispatch release.yml for it, unless a release run for that tag is
        # already queued/running/succeeded. If every earlier release run for it
        # failed, this step fails red and names the run to rerun. Manual
        # releases (no automatic marker) are never touched. On an ordinary
        # no-change day this is one `npm view` and nothing else.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/auto-release.js ensure

      - name: Fail if the release could not be prepared
        # The data was committed above without a version bump; make the run red
        # so the skipped release is noticed. The warning annotation on the commit
        # step has the reason. Next refresh with new data will try again.
        if: steps.commit.outputs.prepare_failed == 'true'
        run: |
          echo "::error::New law data was committed, but no npm release was prepared. See the warning on 'Commit refreshed index if changed'." >&2
          exit 1

      - name: Deploy the website if this run committed
        # The push above used GITHUB_TOKEN, so it does not start deploy-site.yml's `push`
        # trigger ("events triggered by the GITHUB_TOKEN will not create a new workflow run",
        # except workflow_dispatch and repository_dispatch:
        # https://docs.github.com/en/actions/concepts/security/github_token). Dispatch it
        # instead, as "Release if needed" does for release.yml; `actions: write` above covers it.
        # Last, and `!cancelled()`, so it runs whenever the commit step pushed a change the
        # site is built from (output `deploy`: the index, or data/structure), even if the
        # release steps went red, and a failed dispatch can never block a release. A commit of
        # the download record alone sets `pushed` but not `deploy`: the site has not changed.
        if: ${{ !cancelled() && steps.commit.outputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-site.yml --ref main -f reason="daily refresh ${{ github.run_id }}"
