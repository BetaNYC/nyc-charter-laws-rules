# Run the full test suite on every pull request and push.
#
# Node matrix: 20.x and 22.x — the ends of the declared engines range.
# The package.json engines field declares "node >=20 <23", and this matrix
# tests both ends honestly (floor 20, ceiling 22, one below the declared 23).
# Node 18 was dropped from the floor because it reached End-of-Life on
# 2025-04-30; the manifest was previously "node >= 18" but CI never tested 18,
# so the range was aligned down to what is actually verified here.
#
# File naming: this is test.yml. The planned cron for corpus data refresh
# (issue #2) will live in refresh-data.yml to avoid naming collisions.

name: Test

on:
  pull_request:
  push:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20.x"
          - "22.x"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # The site (issues #62 and #65): npm run test:site builds the Charter site from the test
  # fixtures, with its Pagefind index, the real Charter and Administrative Code without one
  # (test/site/admin.test.mjs), and the Rules (test/site/rules.test.mjs: the real Rules when
  # their index names each record's title, else the Rules fixtures), and reads them in headless
  # Chromium (accessibility tree, JavaScript off, search). When data/structure/ is committed (the daily refresh does that), it
  # also builds the whole site, to catch a build that only fails on the full text. Nothing is
  # deployed: the site goes to _site/, which is git-ignored. The job keeps its name, "Charter
  # site", so a required check that names it still matches.
  site:
    name: Charter site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci && npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Site layout on the committed data
        # test/site-data/: kept out of npm test (which the daily refresh runs) on purpose.
        run: npm run test:site-data

      - name: Browser tests
        run: npm run test:site

      - name: Build the whole site (Charter, Administrative Code and Rules)
        if: hashFiles('data/structure/charter.json') != '' && hashFiles('data/structure/admin_code.json') != ''
        run: npm run build-site

  # BetaNYC's What's changed standard (betanyc-ai-workspace
  # platform/system/whats-changed-standard.md § 10). check-whats-changed runs
  # scripts/whats_changed.py check (a copy of the workspace's canonical file: never edit it
  # here; it reads RELEASES.md for its MCP version check), and checks that an
  # "## Unreleased:" entry comes with a hand-bumped, undated "## vX.Y.Z — Unreleased" release.
  # --base-ref adds the append-only check (old entries are never edited) and the version-bump
  # check. The base is the merge base with main, not main's tip: the daily refresh bumps
  # main's version on its own, and a branch that started before such a bump has not changed
  # the version. fetch-depth: 0 so the merge base exists. Built-ins only, so no npm ci.
  whats-changed:
    name: What's changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check WHATS-CHANGED.md
        run: node scripts/auto-release.js check-whats-changed --base-ref "$(git merge-base HEAD origin/main)"

  # BetaNYC's about-data standard (betanyc-ai-workspace platform/system/about-data-standard.md
  # § 7). scripts/whats_changed.py, scripts/tests/catalog_validate.py, scripts/mcp_shared/ and
  # src/betanyc-tools.ts are copies of the workspace's canonical files: never edit them here.
  # 1. DATA-SOURCES.json is valid and every tool the built server lists has a source.
  # 2. data.json (DCAT-US 3.0) matches DATA-SOURCES.json; rebuild with the same command
  #    without --check. 3. DATA-SOURCES.json against its JSON Schema and data.json against the
  #    vendored DCAT-US 3.0 schema, with pinned validators (CI only, not runtime dependencies).
  # The release gate (`about-data check --release`, which also refuses the placeholder
  # contact) runs in release.yml before `npm publish`.
  about-data:
    name: About data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: npm ci && npm run build

      - name: The server's tool list
        run: >-
          node --input-type=module -e '
          const { TOOLS } = await import("./dist/tools.js");
          console.log(JSON.stringify(TOOLS.map((t) => t.name)));
          ' > "$RUNNER_TEMP/tools.json"

      - name: DATA-SOURCES.json is valid and explains every tool
        run: python3 scripts/whats_changed.py about-data check DATA-SOURCES.json --tools-file "$RUNNER_TEMP/tools.json"

      - name: data.json is current
        run: python3 scripts/whats_changed.py about-data catalog DATA-SOURCES.json --check

      - name: Validate against the JSON Schema and DCAT-US 3.0
        run: |
          uv run --no-project --with jsonschema==4.26.0 --with referencing==0.37.0 --with rfc3987==1.3.8 \
            python scripts/tests/catalog_validate.py data-sources DATA-SOURCES.json
          uv run --no-project --with jsonschema==4.26.0 --with referencing==0.37.0 --with rfc3987==1.3.8 \
            python scripts/tests/catalog_validate.py dcat data.json
